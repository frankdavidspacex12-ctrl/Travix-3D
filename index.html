<html lang="en" translate="no" class="notranslate">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta
      name="description"
      content="Travix 3D: simulador espacial 3D en tiempo real con efemérides J2000, telemetría orbital, física solar real y Vía Láctea oficial con soporte completo sin internet."
    />

      property="og:description"
      content="Explora el Sistema Solar, la Vía Láctea, agujeros negros, púlsares, nebulosas NASA y archivo fotográfico de misiones históricas en 3D 100% sin conexión."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-[#05070D] text-slate-100 antialiased overflow-hidden select-none">
